<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="snow-bg"></div>

    <main class="card-container">

        <header class="card-header">
            <span class="card-date">24 октября</span>
            <h1 class="card-title">С днем теплых носков!</h1>
        </header>
        
        <div class="fireplace">
            <div class="fireplace-mantel"></div>
            <div class="fireplace-glow"></div>
            <div class="fire-flame"></div>
        </div>

        <div class="rope">
            <div class="sock">

                <div class="sock-inside">
                    <p>Пусть ноги всегда будут в тепле, а на душе — уютно!</p>
                </div>

                <div class="sock-front">
                    <div class="sock-cuff"></div>
                    <div class="sock-heel"></div>
                    <div class="sock-toe"></div>
                    <span class="sock-pattern">🌟</span>
                </div>  

            </div>
        </div>   
    </main>

</body>
</html>
